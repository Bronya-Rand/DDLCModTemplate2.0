
name: Publish Mod Template
on:
    release:
        types: [published]

permissions:
    contents: "write"
    
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Build ZIPs
              run: |
                TAG="${{ github.event.release.tag_name || github.ref_name }}"
                VER="${TAG#v}"
                mkdir -p ZIPs
                git archive --format=zip -o "ZIPs/DDLCModTemplate-${VER}-Py3.zip" HEAD
                git archive --format=zip -o "ZIPs/DDLCModTemplate-${VER}-Py3Extras.zip" HEAD:"Additional Mod Features"
            
            - name: Upload Release Assets
              uses: softprops/action-gh-release@v3
              with: 
                files: ZIPs/*.zip