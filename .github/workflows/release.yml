
name: Publish Mod Template
on:
    push:
        tags: 
            - "*.*.*"
            - "v*.*.*"

permissions:
    contents: "write"
    
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Build ZIPs
              run: |
                VER="${GITHUB_REF_NAME#v}"
                mkdir -p ZIPs
                git archive --format=zip -o "ZIPs/DDLCModTemplate-${VER}-Py3.zip" HEAD
                git archive --format=zip -o "ZIPs/DDLCModTemplate-${VER}-Py3Extras.zip" 
                    HEAD:"Additional Mod Features"
            
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with: 
                files: ZIPs/*.zip
                generate_release_notes: true